<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>ALTIN YOLU</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
touch-action:none;
}

body{
overflow:hidden;
font-family:Arial;
background:black;
}

canvas{
display:block;
}

#ui{
position:absolute;
top:0;
left:0;
width:100%;
display:flex;
justify-content:space-between;
padding:15px;
color:white;
font-size:24px;
font-weight:bold;
z-index:10;
text-shadow:2px 2px 5px black;
}

#startScreen,
#winScreen{
position:absolute;
width:100%;
height:100%;
background:rgba(0,0,0,0.85);
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
color:white;
z-index:20;
}

#winScreen{
display:none;
}

h1{
font-size:60px;
margin-bottom:20px;
}

p{
font-size:22px;
padding:20px;
text-align:center;
}

button{
padding:18px 50px;
font-size:28px;
border:none;
border-radius:20px;
background:orange;
color:white;
font-weight:bold;
box-shadow:0 0 20px orange;
}

</style>
</head>

<body>

<div id="ui">
<div>ALTIN: <span id="gold">0</span>/100</div>
<div>KARAKTER: <span id="charText">1</span>/5</div>
</div>

<div id="startScreen">

<h1>ALTIN YOLU</h1>

<p>
Şeritlerde ilerle.<br>
Altınları topla.<br>
Her 20 altında karakter değişir.<br>
100 altına ulaş ve kazan.
</p>

<button id="startBtn">BAŞLA</button>

</div>

<div id="winScreen">

<h1>KAZANDIN</h1>

<h2>100 ALTIN TOPLADIN</h2>

<br>

<button onclick="location.reload()">TEKRAR OYNA</button>

</div>

<canvas id="game"></canvas>

<!-- SEN DOSYAYA KOY -->
<audio id="music" src="music.mp3" loop></audio>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

const goldEl = document.getElementById("gold");
const charText = document.getElementById("charText");

const music = document.getElementById("music");

// ================= KARAKTERLER =================

const characters = [];

for(let i=1;i<=5;i++){

let img = new Image();
img.src = "char"+i+".png";

characters.push(img);

}

// ================= OYUNCU =================

const laneWidth = canvas.width / 3;

let currentLane = 1;

const player = {
x: laneWidth * 1 + laneWidth/2 - 50,
y: canvas.height - 180,
w:100,
h:130,
targetX: laneWidth * 1 + laneWidth/2 - 50,
character:0
};

// ================= OYUN =================

let gold = 0;

let gameStarted = false;

let speed = 10;

let coins = [];

let roadLines = [];

let stars = [];

for(let i=0;i<120;i++){

stars.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
size:Math.random()*3
});

}

for(let i=0;i<20;i++){

roadLines.push({
y:i*80
});

}

// ================= ALTIN OLUŞTUR =================

function spawnCoin(){

let lane = Math.floor(Math.random()*3);

coins.push({

lane:lane,

x: laneWidth * lane + laneWidth/2,

y:-50,

size:35

});

}

// ================= ARKA PLAN =================

function drawBackground(){

let gradient = ctx.createLinearGradient(0,0,0,canvas.height);

gradient.addColorStop(0,"#0f2027");
gradient.addColorStop(0.5,"#203a43");
gradient.addColorStop(1,"#2c5364");

ctx.fillStyle = gradient;
ctx.fillRect(0,0,canvas.width,canvas.height);

stars.forEach(s=>{

ctx.fillStyle="white";

ctx.beginPath();
ctx.arc(s.x,s.y,s.size,0,Math.PI*2);
ctx.fill();

s.y += 1;

if(s.y > canvas.height){

s.y = 0;
s.x = Math.random()*canvas.width;

}

});

}

// ================= YOL =================

function drawRoad(){

ctx.fillStyle="#333";

ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.strokeStyle="white";
ctx.lineWidth=8;

ctx.setLineDash([40,40]);

ctx.beginPath();
ctx.moveTo(laneWidth,0);
ctx.lineTo(laneWidth,canvas.height);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(laneWidth*2,0);
ctx.lineTo(laneWidth*2,canvas.height);
ctx.stroke();

ctx.setLineDash([]);

roadLines.forEach(line=>{

line.y += speed;

if(line.y > canvas.height){
line.y = -80;
}

});

}

// ================= OYUNCU =================

function drawPlayer(){

player.x += (player.targetX-player.x)*0.2;

ctx.drawImage(
characters[player.character],
player.x,
player.y,
player.w,
player.h
);

}

// ================= ALTINLAR =================

function drawCoins(){

coins.forEach((coin,index)=>{

coin.y += speed;

ctx.beginPath();

ctx.fillStyle="gold";

ctx.arc(
coin.x,
coin.y,
coin.size,
0,
Math.PI*2
);

ctx.fill();

ctx.fillStyle="yellow";

ctx.font="25px Arial";

ctx.fillText(
"$",
coin.x-8,
coin.y+8
);

if(
player.x < coin.x + coin.size &&
player.x + player.w > coin.x - coin.size &&
player.y < coin.y + coin.size &&
player.y + player.h > coin.y - coin.size
){

gold++;

goldEl.innerText = gold;

coins.splice(index,1);

// HER 20 ALTINDA KARAKTER DEĞİŞ

if(gold === 20){
player.character = 1;
charText.innerText = 2;
}

if(gold === 40){
player.character = 2;
charText.innerText = 3;
}

if(gold === 60){
player.character = 3;
charText.innerText = 4;
}

if(gold === 80){
player.character = 4;
charText.innerText = 5;
}

if(gold >= 100){

document.getElementById(
"winScreen"
).style.display = "flex";

}

}

if(coin.y > canvas.height + 50){

coins.splice(index,1);

}

});

}

// ================= DÖNGÜ =================

function gameLoop(){

if(!gameStarted) return;

ctx.clearRect(0,0,canvas.width,canvas.height);

drawBackground();

drawRoad();

drawPlayer();

drawCoins();

if(Math.random() < 0.03){

spawnCoin();

}

requestAnimationFrame(gameLoop);

}

// ================= KONTROL =================

let touchStartX = 0;

canvas.addEventListener("touchstart",(e)=>{

touchStartX = e.touches[0].clientX;

});

canvas.addEventListener("touchend",(e)=>{

let touchEndX = e.changedTouches[0].clientX;

if(touchEndX - touchStartX > 50){

currentLane++;

}

if(touchStartX - touchEndX > 50){

currentLane--;

}

if(currentLane < 0){
currentLane = 0;
}

if(currentLane > 2){
currentLane = 2;
}

player.targetX =
laneWidth * currentLane +
laneWidth/2 -
player.w/2;

});

// PC İÇİN

window.addEventListener("keydown",(e)=>{

if(e.key === "ArrowRight"){
currentLane++;
}

if(e.key === "ArrowLeft"){
currentLane--;
}

if(currentLane < 0){
currentLane = 0;
}

if(currentLane > 2){
currentLane = 2;
}

player.targetX =
laneWidth * currentLane +
laneWidth/2 -
player.w/2;

});

// ================= BAŞLAT =================

document.getElementById("startBtn").onclick = ()=>{

document.getElementById(
"startScreen"
).style.display = "none";

gameStarted = true;

music.volume = 0.5;

music.play();

gameLoop();

};

// ================= RESIZE =================

window.addEventListener("resize",()=>{

canvas.width = innerWidth;
canvas.height = innerHeight;

});

</script>

</body>
</html>
