<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>RUNNER GAME</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
touch-action:none;
}

body{
overflow:hidden;
background:black;
font-family:Arial;
}

canvas{
display:block;
background:linear-gradient(#4ec0ff,#87e0ff,#ffffff);
}

#ui{
position:absolute;
top:0;
left:0;
width:100%;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
color:white;
font-size:24px;
font-weight:bold;
text-shadow:2px 2px 5px black;
z-index:5;
}

#startScreen{
position:absolute;
width:100%;
height:100%;
background:rgba(0,0,0,0.85);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
color:white;
z-index:10;
}

#startScreen h1{
font-size:60px;
margin-bottom:20px;
}

#startScreen p{
font-size:22px;
margin-bottom:30px;
text-align:center;
padding:20px;
}

#startBtn{
padding:20px 60px;
font-size:30px;
border:none;
border-radius:20px;
background:orange;
color:white;
font-weight:bold;
box-shadow:0 0 20px orange;
}

#gameOver{
position:absolute;
width:100%;
height:100%;
background:rgba(0,0,0,0.85);
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
color:white;
z-index:20;
}

#gameOver h1{
font-size:70px;
margin-bottom:20px;
}

#restartBtn{
padding:20px 50px;
font-size:28px;
border:none;
border-radius:20px;
background:red;
color:white;
font-weight:bold;
}

</style>
</head>

<body>

<div id="ui">
<div>SKOR: <span id="score">0</span></div>
<div>EN YÜKSEK: <span id="highscore">0</span></div>
</div>

<div id="startScreen">
<h1>RUNNER GAME</h1>
<p>
Karakteri parmağınla sağa sola sürükle.<br>
Engellerden kaç ve en yüksek skoru yap.
</p>
<button id="startBtn">OYNA</button>
</div>

<div id="gameOver">
<h1>OYUN BİTTİ</h1>
<h2 id="finalScore"></h2>
<br>
<button id="restartBtn">TEKRAR OYNA</button>
</div>

<canvas id="game"></canvas>

<!-- Müziği sen ekle -->
<audio id="bgMusic" src="music.mp3" loop></audio>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let gameStarted = false;
let gameOver = false;

const scoreEl = document.getElementById("score");
const highscoreEl = document.getElementById("highscore");

let score = 0;
let highscore = localStorage.getItem("runner_highscore") || 0;

highscoreEl.innerText = highscore;

const music = document.getElementById("bgMusic");


// ================= PLAYER =================

const playerImg = new Image();
playerImg.src = "character.png"; // karakter resmi

const player = {
x: canvas.width/2 - 50,
y: canvas.height - 180,
w: 100,
h: 130,
speed: 0,
targetX: canvas.width/2 - 50
};

// ================= ROAD =================

let roadLines = [];

for(let i=0;i<20;i++){
roadLines.push({
x: canvas.width/2 - 10,
y: i * 80,
w:20,
h:50
});
}

// ================= OBSTACLES =================

let obstacles = [];

function spawnObstacle(){

let size = Math.random()*80 + 60;

obstacles.push({
x: Math.random() * (canvas.width - size),
y: -150,
w: size,
h: size,
speed: gameSpeed + Math.random()*4,
type: Math.floor(Math.random()*3)
});

}

// ================= EFFECTS =================

let particles = [];

function createParticles(x,y){

for(let i=0;i<25;i++){
particles.push({
x:x,
y:y,
vx:(Math.random()-0.5)*10,
vy:(Math.random()-0.5)*10,
size:Math.random()*8+2,
life:60
});
}

}

// ================= GAME =================

let gameSpeed = 8;
let obstacleTimer = 0;

function drawRoad(){

ctx.fillStyle = "#444";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.fillStyle = "#666";

roadLines.forEach(line=>{

line.y += gameSpeed;

if(line.y > canvas.height){
line.y = -60;
}

ctx.fillRect(line.x,line.y,line.w,line.h);

});

}

function drawPlayer(){

ctx.drawImage(playerImg, player.x, player.y, player.w, player.h);

}

function drawObstacles(){

obstacles.forEach((o,index)=>{

o.y += o.speed;

if(o.type === 0){
ctx.fillStyle = "red";
}
if(o.type === 1){
ctx.fillStyle = "yellow";
}
if(o.type === 2){
ctx.fillStyle = "purple";
}

ctx.beginPath();
ctx.roundRect(o.x,o.y,o.w,o.h,20);
ctx.fill();

if(
player.x < o.x + o.w &&
player.x + player.w > o.x &&
player.y < o.y + o.h &&
player.y + player.h > o.y
){
endGame();
}

if(o.y > canvas.height+200){
obstacles.splice(index,1);

score++;

scoreEl.innerText = score;

if(score > highscore){
highscore = score;
localStorage.setItem("runner_highscore", highscore);
highscoreEl.innerText = highscore;
}

if(score % 5 === 0){
gameSpeed += 0.5;
}

}

});

}

function drawParticles(){

particles.forEach((p,index)=>{

p.x += p.vx;
p.y += p.vy;
p.life--;

ctx.fillStyle = "orange";
ctx.beginPath();
ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
ctx.fill();

if(p.life <=0){
particles.splice(index,1);
}

});

}

function updatePlayer(){

player.x += (player.targetX - player.x) * 0.2;

if(player.x < 0){
player.x = 0;
}

if(player.x + player.w > canvas.width){
player.x = canvas.width - player.w;
}

}

function gameLoop(){

if(!gameStarted || gameOver) return;

ctx.clearRect(0,0,canvas.width,canvas.height);

drawRoad();

updatePlayer();

drawPlayer();

drawObstacles();

drawParticles();

obstacleTimer++;

if(obstacleTimer > 35){
spawnObstacle();
obstacleTimer = 0;
}

requestAnimationFrame(gameLoop);

}

// ================= TOUCH CONTROL =================

canvas.addEventListener("touchmove",(e)=>{

let touch = e.touches[0];

player.targetX = touch.clientX - player.w/2;

});

canvas.addEventListener("mousemove",(e)=>{

player.targetX = e.clientX - player.w/2;

});

// ================= START =================

document.getElementById("startBtn").onclick = ()=>{

document.getElementById("startScreen").style.display = "none";

gameStarted = true;

music.volume = 0.5;
music.play();

gameLoop();

};

// ================= GAME OVER =================

function endGame(){

gameOver = true;

createParticles(
player.x + player.w/2,
player.y + player.h/2
);

document.getElementById("gameOver").style.display = "flex";

document.getElementById("finalScore").innerText =
"SKORUN: " + score;

}

// ================= RESTART =================

document.getElementById("restartBtn").onclick = ()=>{

location.reload();

};

// ================= RESIZE =================

window.addEventListener("resize",()=>{

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

});

// ================= FPS EFFECT =================

setInterval(()=>{

if(gameStarted && !gameOver){

particles.push({
x: player.x + player.w/2,
y: player.y + player.h,
vx:(Math.random()-0.5)*2,
vy:Math.random()*4,
size:Math.random()*6,
life:20
});

}

},30);

</script>

</body>
</html>
